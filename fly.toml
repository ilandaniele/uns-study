app = "uns-study-api"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile.api"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  # Old Vercel host stays allowed while stale tabs/PWAs still point at it (it 308-redirects).
  WEB_ORIGIN = "https://sala-de-estudio.fly.dev,https://uns-study.vercel.app"
  # https://sala-de-estudio.fly.dev/api/auth/callback/google is an authorized redirect URI in Google Cloud.
  BETTER_AUTH_URL = "https://sala-de-estudio.fly.dev"
  ADMIN_EMAILS = "ilan.daniele@gmail.com"
  GOOGLE_CLIENT_ID = "1032351199989-q4i4g9vsn7unkemt09in1md9omp4hh0o.apps.googleusercontent.com"
  DB_AUTO_MIGRATE = "false"
  # main.ts runs migrations + idempotent seed in-process before listening (no tsx at boot).
  BOOT_MIGRATE_SEED = "true"
  # Keep V8 heap under the 256 MB VM limit so GC kicks in before the OOM killer.
  NODE_OPTIONS = "--max-old-space-size=200"
  ROOM_RESET_TIMEZONE = "America/Argentina/Buenos_Aires"
  TRUST_PROXY_HOPS = "2"
  PRESENCE_DEV_BYPASS = "false"
  VAPID_SUBJECT = "https://sala-de-estudio.fly.dev"
  PUBLIC_WEB_URL = "https://sala-de-estudio.fly.dev"

# Secrets (not set here — `fly secrets set`): DATABASE_URL, GOOGLE_CLIENT_SECRET,
# BETTER_AUTH_SECRET, IP_HASH_SALT, MP_ACCESS_TOKEN, MP_WEBHOOK_SECRET, RESEND_API_KEY, EMAIL_FROM,
# SEAT_VERIFIER_URL, SEAT_VERIFIER_TOKEN.

[deploy]
  # Boot the new version next to the old one and switch only once it passes health checks,
  # so deploys don't take the app down for the ~30 s the single machine needs to restart.
  strategy = "bluegreen"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Keep one machine warm: a cold start runs migrations + seed and made the first request after
  # idle take many seconds (reloads "not loading", buttons hanging).
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/api/v1/health"
    timeout = "5s"

# 256mb is the spec'd default; migrations + seed now run inside the API process (no tsx), so the
# boot peak is lower. Bump to 512mb if it OOMs in practice.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
