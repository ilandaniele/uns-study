# Seat photo verifier (Claude vision). Deploy: `fly deploy -c fly.verifier.toml --remote-only`.
app = "sala-de-estudio-verifier"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile.verifier"
  ignorefile = "Dockerfile.verifier.dockerignore"

[env]
  NODE_ENV = "production"
  PORT = "8080"

# Secrets (not set here, `fly secrets set -c fly.verifier.toml`): VERIFIER_TOKEN, ANTHROPIC_API_KEY.
# API side (`fly secrets set` on the API app): SEAT_VERIFIER_URL=https://sala-de-estudio-verifier.fly.dev/
# and SEAT_VERIFIER_TOKEN (same value as VERIFIER_TOKEN).

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
