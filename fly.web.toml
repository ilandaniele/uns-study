# Web app (Next.js standalone). Deploy: `fly deploy -c fly.web.toml --remote-only`.
app = "sala-de-estudio"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile.web"
  ignorefile = "Dockerfile.web.dockerignore"

  [build.args]
    # Baked into the /api rewrites and the Socket.IO URL at build time.
    API_PROXY_TARGET = "https://uns-study-api.fly.dev"
    # Ads: empty = house ads only. AdSense ids are set; the Ad Manager units are still empty.
    NEXT_PUBLIC_GAM_REWARDED_UNIT = ""
    NEXT_PUBLIC_GAM_INTERSTITIAL_UNIT = ""
    NEXT_PUBLIC_ADSENSE_CLIENT = "ca-pub-1784864280582108"
    NEXT_PUBLIC_ADSENSE_SLOT_RAIL = "5055854239"
    NEXT_PUBLIC_ADSENSE_SLOT_ROOM_BOTTOM = "6400725498"
    NEXT_PUBLIC_ADSENSE_SLOT_COMMUNITY_FEED = "7682017577"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[deploy]
  strategy = "bluegreen"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 150
    hard_limit = 200

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/manifest.webmanifest"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
