version: 2
# Every Dependabot PR runs the full CI, so updates are monthly and grouped, and PRs are not
# rebased on each push to main (each rebase is another full CI run).
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # Keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    groups:
      actions:
        patterns: ["*"]
