name: CI

on:
  push:
    branches-ignore: [main]
    paths-ignore: ["**/*.md", "docs/**", "reference-images/**", "design-options/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "reference-images/**", "design-options/**"]
  # Pushes to main run this through deploy.yml, which only ships a commit that passed every check.
  # Jobs are few on purpose: every job is billed at least one minute.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PGLITE_DIR: memory://
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Whole history for the secret scan: a secret committed and later removed is still leaked.
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan (gitleaks, pinned, checksum verified)
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner --exit-code 1 .
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      # Everything that ships (runtime dependencies) must be free of high/critical advisories.
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Includes the security suite: IDOR checks (authorization.http.test.ts), every route requires
      # auth unless listed in PUBLIC_ROUTES (route-auth-coverage.http.test.ts), rate limits, abuse policy.
      - run: pnpm test
      - name: Schema and migrations in sync
        run: |
          pnpm --filter @sala/database exec drizzle-kit generate
          if [ -n "$(git status --porcelain packages/database/migrations)" ]; then
            git status --porcelain packages/database/migrations
            echo "::error::Schema changed without a migration. Run 'pnpm db:generate' and commit the result."
            exit 1
          fi
      - run: pnpm --filter @sala/api build
      - run: pnpm --filter @sala/web build

  sast:
    name: Static analysis (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          semgrep scan --error --metrics=off
          --config p/typescript --config p/nodejs --config p/react --config p/nextjs
          --config p/secrets --config p/github-actions --config p/dockerfile
