name: Deploy

# Every push to main: full CI, then migrate the production DB, then deploy API, web and the seat
# verifier to Fly. Nothing deploys unless every CI job passed.
on:
  push:
    branches: [main]
    # Docs-only pushes ship nothing, so they spend no Actions minutes.
    paths-ignore: ["**/*.md", "docs/**", "reference-images/**", "design-options/**"]
  workflow_dispatch:

permissions:
  contents: read

# Never run two production deploys at once: overlapping bluegreen deploys leave stale machines.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  migrate:
    name: Migrate production DB
    needs: ci
    # workflow_dispatch can target any branch; only main reaches production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      # Only what the migrator needs, and no install scripts in a job that holds a production token.
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @sala/database...
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: 0.4.112
      # Token scoped to the DB app only (fly tokens create deploy -a sala-de-estudio-db).
      - run: bash ops/migrate-fly-db.sh
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN_DB }}
      # Safety net: if the job was cancelled or killed mid-run, make sure sala_owner is NOLOGIN.
      - name: Re-lock sala_owner
        if: always()
        run: bash ops/migrate-fly-db.sh lock
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN_DB }}

  api:
    name: Deploy API
    needs: migrate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: 0.4.112
      - run: flyctl deploy -c fly.toml --remote-only --wait-timeout 10m
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN_API }}
      - name: Smoke test
        run: |
          base=https://uns-study-api.fly.dev/api/v1
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "$base/health"
          # Protected routes must still refuse anonymous callers.
          for path in profiles/me conversations me/blocks notifications/preferences admin/users admin/audit; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base/$path")
            [ "$code" = 401 ] || { echo "::error::/$path returned $code without auth"; exit 1; }
          done
          headers=$(curl -fsS -D - -o /dev/null "$base/health" | tr 'A-Z' 'a-z')
          for h in strict-transport-security content-security-policy x-content-type-options; do
            grep -q "^$h:" <<<"$headers" || { echo "::error::API response lacks $h"; exit 1; }
          done

  web:
    name: Deploy web
    needs: api
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: 0.4.112
      - run: flyctl deploy -c fly.web.toml --remote-only --wait-timeout 10m
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN_WEB }}
      - name: Smoke test
        run: |
          headers=$(curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -D - -o /dev/null https://saladeestudio.com.ar/ | tr 'A-Z' 'a-z')
          for h in strict-transport-security content-security-policy x-content-type-options; do
            grep -q "^$h:" <<<"$headers" || { echo "::error::web response lacks $h"; exit 1; }
          done

  verifier:
    name: Deploy seat verifier
    # After migrate: the verifier only ships once the schema it may rely on is in place.
    needs: [ci, migrate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: 0.4.112
      - run: flyctl deploy -c fly.verifier.toml --remote-only --wait-timeout 10m
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN_VERIFIER }}
