name: Deploy

# Every push to main: full CI, then deploy the API Worker, then the web Worker, then smoke-test
# production. Nothing deploys unless every CI job passed. The Durable Object migrates its own
# SQLite schema on first request, so there is no separate migration job.
on:
  push:
    branches: [main]
    # Docs-only pushes ship nothing, so they spend no Actions minutes.
    paths-ignore: ["**/*.md", "docs/**", "reference-images/**", "design-options/**"]
  workflow_dispatch:

permissions:
  contents: read

# Never run two production deploys at once.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  api:
    name: Deploy API
    needs: ci
    # workflow_dispatch can target any branch; only main reaches production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sala/api exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  web:
    name: Deploy web
    needs: api
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # NEXT_PUBLIC_* are inlined at build time. They are public values kept in repository variables.
      # Ads: empty = house ads only.
      - run: pnpm --filter @sala/web exec opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_GAM_REWARDED_UNIT: ${{ vars.NEXT_PUBLIC_GAM_REWARDED_UNIT }}
          NEXT_PUBLIC_GAM_INTERSTITIAL_UNIT: ${{ vars.NEXT_PUBLIC_GAM_INTERSTITIAL_UNIT }}
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT }}
          NEXT_PUBLIC_ADSENSE_SLOT_RAIL: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_RAIL }}
          NEXT_PUBLIC_ADSENSE_SLOT_COMMUNITY_FEED: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_COMMUNITY_FEED }}
          NEXT_PUBLIC_ADSENSE_SLOT_ROOM_BOTTOM: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_ROOM_BOTTOM }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      - run: pnpm --filter @sala/web exec opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  smoke:
    name: Smoke test production
    needs: web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: API checks
        run: |
          base=https://saladeestudio.com.ar/api/v1
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "$base/health"
          # Protected routes must still refuse anonymous callers.
          for path in profiles/me conversations me/blocks notifications/preferences admin/users admin/audit; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base/$path")
            [ "$code" = 401 ] || { echo "::error::/$path returned $code without auth"; exit 1; }
          done
          headers=$(curl -fsS -D - -o /dev/null "$base/health" | tr 'A-Z' 'a-z')
          for h in strict-transport-security content-security-policy x-content-type-options; do
            grep -q "^$h:" <<<"$headers" || { echo "::error::API response lacks $h"; exit 1; }
          done
      - name: Web checks
        run: |
          headers=$(curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -D - -o /dev/null https://saladeestudio.com.ar/ | tr 'A-Z' 'a-z')
          for h in strict-transport-security content-security-policy x-content-type-options; do
            grep -q "^$h:" <<<"$headers" || { echo "::error::web response lacks $h"; exit 1; }
          done
      - name: End-to-end smoke (read-only)
        run: node apps/api/scripts/smoke.mjs https://saladeestudio.com.ar
