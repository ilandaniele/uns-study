name: Load Tests

# k6 load tests against a stack booted INSIDE the runner (`wrangler dev` running the API Worker and its
# Durable Object SQLite from this commit), reached on localhost. There is deliberately no input for a target
# URL: this workflow can never point at production (and tests/load/config/base.js refuses
# saladeestudio.com.ar / *.workers.dev anyway).
#
# Not wired to pull_request: ci.yml never boots the API (its tests run on in-memory SQLite), and a PR smoke
# run would add a `wrangler dev` boot to every PR. Run it on demand or on the weekly schedule instead.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario to run
        required: true
        default: smoke
        type: choice
        options: [smoke, load, stress, spike, soak, peak]
      soak_hold:
        description: Soak plateau duration (only used by soak; default 2h)
        required: false
        default: 2h
        type: string
  schedule:
    - cron: "0 6 1 * *" # 1st of each month, 06:00 UTC (monthly to save Actions minutes); the scheduled run is the `load` scenario

permissions:
  contents: read

# One run per scenario: each run boots its own API + Durable Object inside its own runner, so scenarios do not share
# state and can run in parallel. (A shared concurrency group would keep only one pending run and silently
# cancel the rest when several scenarios are dispatched at once.)
concurrency:
  group: load-tests-${{ inputs.scenario || 'load' }}
  cancel-in-progress: false

jobs:
  k6:
    name: k6 (local stack)
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      SCENARIO: ${{ inputs.scenario || 'load' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # NODE_ENV is overridden to development: Better Auth's per-IP limiter (3 sign-ups/min, production only)
      # must not throttle the setup() sign-ups. The auth secret and IP salt are throwaway values generated
      # for this run; the Durable Object SQLite is local to this runner and migrates + seeds on first request.
      - name: Start API
        run: |
          mkdir -p tests/load/results
          cd apps/api
          # Written straight to the gitignored .dev.vars that wrangler dev reads: the values never pass
          # through shell variables, command lines or the log.
          {
            printf 'BETTER_AUTH_SECRET=%s\n' "$(openssl rand -hex 32)"
            printf 'IP_HASH_SALT=%s\n' "$(openssl rand -hex 16)"
          } > .dev.vars
          nohup pnpm exec wrangler dev --port 4000 --persist-to "$RUNNER_TEMP/wrangler-state" \
            --var NODE_ENV:development \
            --var WEB_ORIGINS:http://localhost:3000 \
            --var BETTER_AUTH_URL:http://localhost:4000 \
            --var PUBLIC_WEB_URL:http://localhost:3000 \
            --var PRESENCE_DEV_BYPASS:false \
            > ../../tests/load/results/api.log 2>&1 &
          echo "API_PID=$!" >> "$GITHUB_ENV"
          cd ../..
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:4000/api/v1/health > /dev/null; then echo "API up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "::error::API did not become healthy"
          tail -n 50 tests/load/results/api.log
          exit 1

      # k6 cannot see server memory; sample the total RSS of the local workerd processes (the Worker and its
      # Durable Object run there) so soak runs can show growth.
      - name: Sample API memory
        run: |
          nohup bash -c 'echo "ts,rss_kb" > tests/load/results/api-rss.csv; while kill -0 "$API_PID" 2>/dev/null; do echo "$(date +%s),$(ps -C workerd -o rss= | awk "{s+=\$1} END {print s+0}")" >> tests/load/results/api-rss.csv; sleep 30; done' > /dev/null 2>&1 &

      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1

      - name: Run k6 ${{ env.SCENARIO }}
        env:
          BASE_URL: http://localhost:4000
          ORIGIN: http://localhost:3000
          SOAK_HOLD: ${{ inputs.soak_hold || '2h' }}
        run: k6 run "tests/load/scenarios/${SCENARIO}.js"

      - name: Check API survived
        run: |
          if ! kill -0 "$API_PID" 2>/dev/null; then
            echo "::error::API process exited during the run (crash)"
            tail -n 50 tests/load/results/api.log
            exit 1
          fi
          echo "API alive, workerd RSS $(ps -C workerd -o rss= | awk '{s+=$1} END {print s+0}') kB"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k6-${{ env.SCENARIO }}-results
          path: tests/load/results/
          if-no-files-found: warn
