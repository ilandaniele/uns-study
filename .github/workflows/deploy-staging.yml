name: Deploy staging

# Every push to the `staging` branch: full CI, then deploy uns-api-staging and uns-web-staging to
# https://dev.saladeestudio.com.ar. Staging has its own Durable Object (separate SQLite), so nothing
# here touches production data. It shares the account's Workers Free quotas with production.
on:
  push:
    branches: [staging]
    paths-ignore: ["**/*.md", "docs/**", "reference-images/**", "design-options/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  api:
    name: Deploy API (staging)
    needs: ci
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sala/api exec wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # First deploy only: generate the required staging secrets here, so nobody ever sees them.
      # Existing secrets are never overwritten.
      - name: Bootstrap required staging secrets
        working-directory: apps/api
        run: |
          existing=$(pnpm exec wrangler secret list --env staging --format json)
          for name in BETTER_AUTH_SECRET IP_HASH_SALT; do
            if grep -q "\"$name\"" <<<"$existing"; then
              echo "$name already set"
            else
              openssl rand -base64 48 | tr -d '\n' | pnpm exec wrangler secret put "$name" --env staging
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  web:
    name: Deploy web (staging)
    needs: api
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No ads, analytics or Turnstile on staging: those keys are bound to the production host.
      - run: pnpm --filter @sala/web exec opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SITE_ENV: staging
          NEXT_PUBLIC_APP_URL: https://dev.saladeestudio.com.ar
      - run: pnpm --filter @sala/web exec opennextjs-cloudflare deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  smoke:
    name: Smoke test staging
    needs: web
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null https://dev.saladeestudio.com.ar/api/v1/health
      - run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null https://dev.saladeestudio.com.ar/
