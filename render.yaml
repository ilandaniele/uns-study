services:
  - type: web
    name: uns-study-api
    runtime: node
    region: virginia
    plan: free
    # Free plan has no preDeployCommand, so migrate+seed run as part of the start command.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @uns/api build
    startCommand: pnpm db:migrate && pnpm db:seed && pnpm --filter @uns/api start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: WEB_ORIGIN
        value: https://uns-study.vercel.app
      - key: BETTER_AUTH_URL
        value: https://uns-study.vercel.app
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: IP_HASH_SALT
        generateValue: true
      # Neon Postgres (project sala-estudio-uns, AWS us-east-1). Set by hand in the Render
      # dashboard (direct, non-pooled connection string with sslmode=require).
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: uns-study-kv
          property: connectionString
      - key: ADMIN_EMAILS
        value: ilan.daniele@gmail.com
      # Google OAuth client "Sala de Estudio UNS (web)" in GCP project sala-de-estudio-uns.
      # The client ID is public; GOOGLE_CLIENT_SECRET is set by hand in the Render dashboard.
      - key: GOOGLE_CLIENT_ID
        value: 1032351199989-q4i4g9vsn7unkemt09in1md9omp4hh0o.apps.googleusercontent.com
      - key: DB_AUTO_MIGRATE
        value: "false"
      - key: ROOM_RESET_TIMEZONE
        value: America/Argentina/Buenos_Aires
      - key: TRUST_PROXY_HOPS
        value: "2"
      - key: PRESENCE_DEV_BYPASS
        value: "false"

  - type: keyvalue
    name: uns-study-kv
    plan: free
    region: virginia
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: uns-study-db
    plan: free
    region: virginia
    databaseName: uns_study
    user: uns_study
    postgresMajorVersion: "16"
