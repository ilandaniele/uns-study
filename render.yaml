services:
  - type: web
    name: uns-study-api
    runtime: node
    region: virginia
    plan: free
    # Free plan has no preDeployCommand, so migrate+seed run as part of the start command.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @uns/api build
    startCommand: pnpm db:migrate && pnpm db:seed && pnpm --filter @uns/api start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: WEB_ORIGIN
        value: https://uns-study.vercel.app
      - key: BETTER_AUTH_URL
        value: https://uns-study.vercel.app
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: IP_HASH_SALT
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: ADMIN_EMAILS
        value: ilan.daniele@gmail.com
      - key: DB_AUTO_MIGRATE
        value: "false"
      - key: ROOM_RESET_TIMEZONE
        value: America/Argentina/Buenos_Aires
      - key: TRUST_PROXY_HOPS
        value: "2"
      - key: PRESENCE_DEV_BYPASS
        value: "false"
